name: Daily MLB settlement and prediction refresh

on:
  schedule:
    # GitHub cron uses UTC. Poll at Taiwan 13:30, 15:30, 17:30, 19:30, 21:30 and 22:30.
    # Completed games are published the same Taiwan day instead of waiting until late evening.
    - cron: "30 5,7,9,11,13,14 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-prediction-refresh.yml"

permissions:
  contents: write

concurrency:
  group: daily-mlb-prediction-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install daily-model dependency
        run: python -m pip install --disable-pip-version-check pandas

      - name: Settle Taiwan-today results and publish tomorrow predictions
        run: python scripts/run_daily_workflow.py --date "$(date +%F)" --skip-backtest-refresh

      - name: Commit generated public data
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "data: refresh Taiwan MLB settlement and predictions"
          git pull --rebase origin main
          git push origin HEAD:main
