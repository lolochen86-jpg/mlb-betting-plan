name: Daily MLB settlement and prediction refresh

on:
  schedule:
    # GitHub cron uses UTC. These runs correspond to Taiwan 03:00, 05:00, 07:00,
    # 09:00, 11:00, 13:00, 15:00, 17:00, 19:00, 21:00 and 23:00.
    # Each run publishes games that are already Final; unfinished games remain pending
    # and are picked up by the next two-hour run.
    - cron: "0 1,3,5,7,9,11,13,15,19,21,23 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-prediction-refresh.yml"

permissions:
  contents: write

concurrency:
  group: daily-mlb-prediction-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install daily-model dependency
        run: python -m pip install --disable-pip-version-check pandas

      - name: Settle completed Taiwan-today games and keep unfinished games pending
        run: python scripts/run_daily_workflow.py --date "$(date +%F)" --skip-backtest-refresh

      - name: Commit generated public data
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "data: refresh Taiwan MLB settlement and predictions"
          git pull --rebase origin main
          git push origin HEAD:main
